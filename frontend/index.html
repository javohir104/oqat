<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oqat — Yaqin ovqatlanish joylari va menyu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Yandex Maps JS API v2.1 -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
</head>
<body>
    <!-- Asosiy ilova konteyneri -->
    <div class="app-container">
        
        <!-- Yuqori qidiruv va filtr qismi -->
        <header class="app-header">
            <div class="header-top">
                <div class="brand">
                    <span class="logo-icon">🍲</span>
                    <span class="logo-text">Oqat</span>
                </div>
                <div class="view-toggles">
                    <button id="viewToggleBtn" class="btn-icon" title="Xarita / Ro'yxat ko'rinishi">
                        <i class="fa-solid fa-list-ul"></i>
                    </button>
                    <button id="locateMeBtn" class="btn-icon" title="Mening joylashuvim">
                        <i class="fa-solid fa-crosshairs"></i>
                    </button>
                </div>
            </div>

            <!-- Qidiruv paneli -->
            <div class="search-bar-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Oshxona, kofe yoki taom qidiring..." autocomplete="off">
                <button id="clearSearchBtn" class="clear-btn hidden"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Kategoriya tugmalari (Gorizontal scroll) -->
            <div class="categories-scroll" id="categoriesContainer">
                <!-- Javascript orqali to'ldiriladi -->
            </div>
        </header>

        <!-- Xarita konteyneri -->
        <main id="map" class="map-view"></main>

        <!-- Ro'yxat ko'rinishi (Map o'rniga yoki uning ustida) -->
        <section id="listView" class="list-view hidden">
            <div class="list-header">
                <h3 id="nearbyCountTitle">Yaqin ovqatlanish joylari</h3>
            </div>
            <div class="restaurant-cards-grid" id="restaurantCardsContainer">
                <!-- Javascript orqali kartochkalar joylanadi -->
            </div>
        </section>

        <!-- Pastdan chiquvchi Menyu oynasi (Bottom Sheet / Modal) -->
        <div id="menuBottomSheet" class="bottom-sheet collapsed">
            <!-- Tutqich (Drag handle) -->
            <div class="sheet-drag-area" id="sheetDragArea">
                <div class="sheet-handle"></div>
            </div>

            <div class="sheet-scroll-body">
                <!-- Restoran haqida qisqacha banner -->
                <div class="restaurant-hero" id="sheetRestHero">
                    <img id="sheetRestPhoto" src="" alt="Restoran surati">
                    <div class="hero-overlay">
                        <button class="close-sheet-btn" id="closeSheetBtn"><i class="fa-solid fa-xmark"></i></button>
                        <div class="hero-info">
                            <span class="category-badge" id="sheetRestCategory">Milliy</span>
                            <h2 id="sheetRestName">Restoran nomi</h2>
                            <p class="rest-address" id="sheetRestAddress"><i class="fa-solid fa-location-dot"></i> Manzil</p>
                        </div>
                    </div>
                </div>

                <!-- Restoran ma'lumotlari: masofa, reyting, telefon -->
                <div class="restaurant-meta-bar">
                    <div class="meta-item">
                        <i class="fa-solid fa-star star-icon"></i>
                        <span id="sheetRestRating" class="bold">4.8</span>
                    </div>
                    <div class="meta-divider"></div>
                    <div class="meta-item">
                        <i class="fa-solid fa-person-walking"></i>
                        <span id="sheetRestDistance">350 m</span>
                    </div>
                    <div class="meta-divider"></div>
                    <a href="#" id="sheetRestPhoneLink" class="call-btn">
                        <i class="fa-solid fa-phone"></i> Qo'ng'iroq
                    </a>
                </div>

                <!-- Menyu sarlavhasi -->
                <div class="menu-section-header">
                    <h3>Taomlar Menyusi</h3>
                    <span id="sheetMenuCount" class="badge-count">0 ta taom</span>
                </div>

                <!-- Taomlar ro'yxati -->
                <div class="menu-items-list" id="sheetMenuItemsContainer">
                    <!-- Dinamik ravishda taomlar chiqadi -->
                </div>
            </div>
        </div>

        <!-- Orqa fon qoraytirgich (Overlay) -->
        <div id="modalBackdrop" class="modal-backdrop hidden"></div>
    </div>

    <!-- Skriptlar -->
    <script src="js/mockData.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
